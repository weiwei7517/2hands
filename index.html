<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2hands｜二手衣小店</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
    "PingFang TC","Microsoft JhengHei",sans-serif;
    background:#f7f7f5;
    color:#333;
}

header{
    background:#fff;
    padding:28px 20px 22px;
    border-bottom:1px solid #e8e8e5;
    position:sticky;
    top:0;
    z-index:10;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:700;
    letter-spacing:1px;
}

.tagline{
    margin-top:5px;
    font-size:13px;
    color:#888;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.add-btn{
    background:#333;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-size:14px;
}

.add-btn:active{
    transform:scale(.97);
}

.container{
    max-width:1100px;
    margin:0 auto;
    padding:25px 20px 60px;
}

.empty{
    text-align:center;
    padding:100px 20px;
    color:#999;
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

.empty-title{
    font-size:18px;
    color:#555;
    margin-bottom:8px;
}

.empty-text{
    font-size:13px;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e9e9e7;
}

.card-photo{
    width:100%;
    aspect-ratio:1/1;
    background:#f0f0ed;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:13px;
}

.card-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card-name{
    font-size:16px;
    font-weight:600;
    margin-bottom:8px;
}

.card-price{
    font-size:18px;
    font-weight:700;
    margin-bottom:12px;
}

.card-info{
    font-size:12px;
    color:#888;
    line-height:1.8;
}

.card-description{
    margin-top:10px;
    font-size:13px;
    line-height:1.7;
    color:#666;
}

.card-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.edit-btn,
.delete-btn{
    flex:1;
    padding:9px;
    border-radius:8px;
    font-size:12px;
}

.edit-btn{
    background:#eee;
    color:#333;
}

.delete-btn{
    background:#f3eeee;
    color:#a55;
}

/* 遮罩 */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    overflow-y:auto;
    padding:30px 15px;
}

.modal.show{
    display:block;
}

.modal-box{
    width:100%;
    max-width:600px;
    margin:auto;
    background:#fff;
    border-radius:16px;
    padding:25px;
}

.modal-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:7px;
    color:#555;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#888;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.photo-upload{
    border:1px dashed #ccc;
    border-radius:10px;
    padding:20px;
    text-align:center;
    color:#999;
    font-size:13px;
}

.photo-preview{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:12px;
}

.preview-item{
    position:relative;
    aspect-ratio:1/1;
    border-radius:8px;
    overflow:hidden;
    background:#eee;
}

.preview-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.remove-photo{
    position:absolute;
    top:5px;
    right:5px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:13px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:25px;
}

.cancel-btn,
.save-btn{
    flex:1;
    padding:13px;
    border-radius:9px;
    font-size:14px;
}

.cancel-btn{
    background:#eee;
}

.save-btn{
    background:#333;
    color:#fff;
}

@media(max-width:800px){
    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
}

@media(max-width:500px){
    .header-inner{
        align-items:flex-start;
    }

    .logo{
        font-size:21px;
    }

    .tagline{
        font-size:11px;
    }

    .add-btn{
        padding:10px 13px;
        white-space:nowrap;
    }

    .container{
        padding:18px 12px 50px;
    }

    .products{
        gap:10px;
    }

    .card-body{
        padding:12px;
    }

    .card-name{
        font-size:14px;
    }

    .card-price{
        font-size:16px;
    }

    .modal-box{
        padding:20px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <div class="logo">2hands</div>
            <div class="tagline">當🦘衣服穿不到，拜託大家照顧了</div>
        </div>

        <button class="add-btn" onclick="openAddModal()">
            ＋ 新增商品
        </button>
    </div>
</header>

<main class="container">

    <div id="emptyState" class="empty">
        <div class="empty-icon">🧺</div>
        <div class="empty-title">目前還沒有商品</div>
        <div class="empty-text">
            按右上角「＋ 新增商品」開始新增你的衣服
        </div>
    </div>

    <div id="products" class="products"></div>

</main>


<!-- 新增 / 編輯視窗 -->

<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-title" id="modalTitle">
            新增商品
        </div>

        <form id="productForm">

            <div class="form-group">
                <label>商品照片</label>

                <div class="photo-upload">
                    <input
                        type="file"
                        id="photoInput"
                        accept="image/*"
                        multiple
                    >
                    <div style="margin-top:8px;">
                        可一次選擇多張照片
                    </div>
                </div>

                <div id="photoPreview" class="photo-preview"></div>
            </div>

            <div class="form-group">
                <label>商品名稱 *</label>
                <input
                    type="text"
                    id="name"
                    placeholder="例如：米白針織外套"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>售價 *</label>
                    <input
                        type="number"
                        id="price"
                        placeholder="500"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>尺寸</label>
                    <input
                        type="text"
                        id="size"
                        placeholder="S / M / L / Free"
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>品牌</label>
                    <input
                        type="text"
                        id="brand"
                        placeholder="品牌名稱"
                    >
                </div>

                <div class="form-group">
                    <label>商品狀況</label>
                    <select id="condition">
                        <option value="">請選擇</option>
                        <option value="全新">全新</option>
                        <option value="近全新">近全新</option>
                        <option value="良好">良好</option>
                        <option value="正常使用痕跡">正常使用痕跡</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>分類</label>
                <select id="category">
                    <option value="">請選擇分類</option>
                    <option value="上衣">上衣</option>
                    <option value="外套">外套</option>
                    <option value="洋裝">洋裝</option>
                    <option value="褲子">褲子</option>
                    <option value="裙子">裙子</option>
                    <option value="鞋子">鞋子</option>
                    <option value="包包">包包</option>
                    <option value="配件">配件</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label>商品介紹</label>
                <textarea
                    id="description"
                    placeholder="寫一下商品狀況、穿過幾次、尺寸細節等等..."
                ></textarea>
            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    取消
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    儲存商品
                </button>

            </div>

        </form>

    </div>

</div>


<script>

let products = JSON.parse(
    localStorage.getItem("twoHandsProducts") || "[]"
);

let editingId = null;
let selectedImages = [];


// ==========================
// 初始化
// ==========================

renderProducts();


// ==========================
// 顯示商品
// ==========================

function renderProducts(){

    const container = document.getElementById("products");
    const emptyState = document.getElementById("emptyState");

    container.innerHTML = "";

    if(products.length === 0){

        emptyState.style.display = "block";
        return;

    }

    emptyState.style.display = "none";

    products.forEach(product => {

        const card = document.createElement("div");

        card.className = "card";

        let photoHTML = `
            <div class="card-photo">
                尚未上傳照片
            </div>
        `;

        if(product.images && product.images.length > 0){

            photoHTML = `
                <div class="card-photo">
                    <img src="${product.images[0]}" alt="">
                </div>
            `;

        }

        card.innerHTML = `

            ${photoHTML}

            <div class="card-body">

                <div class="card-name">
                    ${escapeHTML(product.name)}
                </div>

                <div class="card-price">
                    NT$ ${Number(product.price).toLocaleString()}
                </div>

                <div class="card-info">

                    ${product.brand
                        ? `品牌：${escapeHTML(product.brand)}<br>`
                        : ""
                    }

                    ${product.size
                        ? `尺寸：${escapeHTML(product.size)}<br>`
                        : ""
                    }

                    ${product.condition
                        ? `狀況：${escapeHTML(product.condition)}<br>`
                        : ""
                    }

                    ${product.category
                        ? `分類：${escapeHTML(product.category)}`
                        : ""
                    }

                </div>

                ${
                    product.description
                    ?
                    `<div class="card-description">
                        ${escapeHTML(product.description)}
                    </div>`
                    :
                    ""
                }

                <div class="card-actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct('${product.id}')"
                    >
                        編輯
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct('${product.id}')"
                    >
                        刪除
                    </button>

                </div>

            </div>
        `;

        container.appendChild(card);

    });

}


// ==========================
// 開啟新增
// ==========================

function openAddModal(){

    editingId = null;
    selectedImages = [];

    document.getElementById("modalTitle").textContent = "新增商品";

    document.getElementById("productForm").reset();

    document.getElementById("photoPreview").innerHTML = "";

    document.getElementById("modal").classList.add("show");

}


// ==========================
// 關閉
// ==========================

function closeModal(){

    document.getElementById("modal").classList.remove("show");

}


// ==========================
// 圖片選擇
// ==========================

document
.getElementById("photoInput")
.addEventListener("change", function(e){

    const files = Array.from(e.target.files);

    files.forEach(file => {

        const reader = new FileReader();

        reader.onload = function(event){

            selectedImages.push(event.target.result);

            renderPhotoPreview();

        };

        reader.readAsDataURL(file);

    });

});


// ==========================
// 圖片預覽
// ==========================

function renderPhotoPreview(){

    const preview =
        document.getElementById("photoPreview");

    preview.innerHTML = "";

    selectedImages.forEach((image,index) => {

        const item = document.createElement("div");

        item.className = "preview-item";

        item.innerHTML = `

            <img src="${image}" alt="">

            <button
                type="button"
                class="remove-photo"
                onclick="removePhoto(${index})"
            >
                ×
            </button>

        `;

        preview.appendChild(item);

    });

}


// ==========================
// 移除照片
// ==========================

function removePhoto(index){

    selectedImages.splice(index,1);

    renderPhotoPreview();

}


// ==========================
// 儲存商品
// ==========================

document
.getElementById("productForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const price =
        document.getElementById("price").value;

    const size =
        document.getElementById("size").value.trim();

    const brand =
        document.getElementById("brand").value.trim();

    const condition =
        document.getElementById("condition").value;

    const category =
        document.getElementById("category").value;

    const description =
        document.getElementById("description").value.trim();


    if(!name || price === ""){

        alert("請填寫商品名稱和售價");

        return;

    }


    // 編輯
    if(editingId){

        const index =
            products.findIndex(
                p => p.id === editingId
            );

        if(index !== -1){

            products[index] = {

                ...products[index],

                name,
                price,
                size,
                brand,
                condition,
                category,
                description,
                images:selectedImages

            };

        }

    }

    // 新增
    else{

        const product = {

            id:
                Date.now().toString(),

            name,
            price,
            size,
            brand,
            condition,
            category,
            description,
            images:selectedImages,

            createdAt:
                new Date().toISOString()

        };

        products.unshift(product);

    }


    localStorage.setItem(
        "twoHandsProducts",
        JSON.stringify(products)
    );


    closeModal();

    renderProducts();

});


// ==========================
// 編輯商品
// ==========================

function editProduct(id){

    const product =
        products.find(p => p.id === id);

    if(!product) return;

    editingId = id;

    selectedImages =
        [...(product.images || [])];

    document.getElementById("modalTitle")
        .textContent = "編輯商品";

    document.getElementById("name")
        .value = product.name || "";

    document.getElementById("price")
        .value = product.price || "";

    document.getElementById("size")
        .value = product.size || "";

    document.getElementById("brand")
        .value = product.brand || "";

    document.getElementById("condition")
        .value = product.condition || "";

    document.getElementById("category")
        .value = product.category || "";

    document.getElementById("description")
        .value = product.description || "";


    renderPhotoPreview();

    document.getElementById("modal")
        .classList.add("show");

}


// ==========================
// 刪除商品
// ==========================

function deleteProduct(id){

    const product =
        products.find(p => p.id === id);

    if(!product) return;

    const yes =
        confirm(`確定要刪除「${product.name}」嗎？`);

    if(!yes) return;

    products =
        products.filter(
            p => p.id !== id
        );

    localStorage.setItem(
        "twoHandsProducts",
        JSON.stringify(products)
    );

    renderProducts();

}


// ==========================
// HTML 安全處理
// ==========================

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// ==========================
// 點遮罩關閉
// ==========================

document
.getElementById("modal")
.addEventListener("click", function(e){

    if(e.target === this){

        closeModal();

    }

});

</script>

</body>
</html>
